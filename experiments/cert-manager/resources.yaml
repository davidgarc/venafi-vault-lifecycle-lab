apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [vault-issuer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-tls
  namespace: demo
spec:
  secretName: demo-tls
  commonName: demo.cm.test
  dnsNames: [demo.cm.test]
  duration: 1h
  renewBeforePercentage: 50
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: vault
    kind: Issuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: venafi-lab/demo:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: EXPERIMENT, value: cert-manager}
            - {name: CERT_STORAGE, value: Kubernetes TLS Secret / demo-tls}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          readinessProbe:
            httpGet: {path: /cgi-bin/cert, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: certs, mountPath: /certs, readOnly: true}
      volumes:
        - name: certs
          secret:
            secretName: demo-tls
            defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
spec:
  type: NodePort
  selector: {app: demo}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
