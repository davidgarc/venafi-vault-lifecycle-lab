apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    venafi-lab-experiment: agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo, experiment: agent}
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/auth-path: auth/kubernetes-agent
        vault.hashicorp.com/role: demo
        vault.hashicorp.com/agent-image: hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569
        vault.hashicorp.com/agent-run-as-user: '100'
        vault.hashicorp.com/agent-run-as-group: '1000'
        vault.hashicorp.com/template-lease-renewal-threshold: '0.5'
        vault.hashicorp.com/template-config-exit-on-retry-failure: 'false'
        vault.hashicorp.com/agent-inject-secret-bundle: venafi-agent/issue/demo
        vault.hashicorp.com/agent-inject-file-bundle: bundle.pem
        vault.hashicorp.com/agent-inject-perms-bundle: '0440'
        vault.hashicorp.com/agent-inject-template-bundle: |
          {{- with pkiCert "venafi-agent/issue/demo" "common_name=demo.agent.test" "ttl=1h" -}}
          {{ .Cert }}
          {{ .Key }}
          {{ range .CAChain }}{{ . }}
          {{ end }}
          {{- end }}
    spec:
      serviceAccountName: demo
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: venafi-lab/demo:local
          imagePullPolicy: Never
          env:
            - {name: CERT_FILE, value: /vault/secrets/bundle.pem}
            - {name: KEY_FILE, value: /vault/secrets/bundle.pem}
            - {name: EXPERIMENT, value: agent}
            - {name: CERT_STORAGE, value: "Agent memory emptyDir; durable identity in Vault plugin storage"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
spec:
  type: NodePort
  selector: {app: demo}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
